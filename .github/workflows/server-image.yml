name: Server image

on:
  # Runs on pushes to the default branch that change the server. The message of the newest
  # commit steers it like deploy.yml: "[skip deploy]" builds nothing, "[deploy dev]" pushes only
  # the tag "dev", so the Pi (which follows "latest") stays unchanged.
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/server-image.yml"

  workflow_dispatch:
    inputs:
      target:
        description: "Ziel des Images"
        type: choice
        options: [production, dev]
        default: production

permissions:
  contents: read
  packages: write

concurrency:
  group: "server-image"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rakhoo/notenfeder-server

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    env:
      DEV: ${{ (inputs.target == 'dev' || contains(github.event.head_commit.message, '[deploy dev]')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go vet ./... && go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose tags
        id: tags
        run: |
          if [ "$DEV" = "true" ]; then
            echo "tags=$IMAGE:dev" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:latest,$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
