name: Deploy to Cloudflare Pages

on:
  # Runs on pushes to main (production) and dev (dev preview at dev.tablegrade.pages.dev) that
  # change the frontend build; server, docs and tests alone deploy nothing. The message of the
  # newest commit of a push steers it: "[skip deploy]" deploys nothing, "[deploy dev]" on main
  # deploys to the dev preview instead of production. GitHub's own "[skip ci]" skips all
  # workflows.
  push:
    branches: ["main", "dev"]
    paths:
      - "src/**"
      - "!src/**/*.test.ts"
      - "!src/test/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "pwa-assets.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - ".github/workflows/deploy.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      target:
        description: "Ziel des Deployments"
        type: choice
        options: [production, dev]
        default: production

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy job
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    env:
      # Cloudflare Pages treats every branch other than the production branch as a preview.
      # The dev branch always goes to the preview, even when run manually with "production".
      DEPLOY_BRANCH: ${{ (github.ref == 'refs/heads/dev' || inputs.target == 'dev' || contains(github.event.head_commit.message, '[deploy dev]')) && 'dev' || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .vite/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Vite
        # Address of the sync server (repository variable); empty builds the app without sync
        env:
          # A separate dev server can be set as VITE_SYNC_URL_DEV; without it both use the same
          VITE_SYNC_URL: ${{ env.DEPLOY_BRANCH == 'dev' && vars.VITE_SYNC_URL_DEV || vars.VITE_SYNC_URL }}
        run: ${{ steps.detect-package-manager.outputs.runner }} tsc -b && ${{ steps.detect-package-manager.outputs.runner }} vite build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=tablegrade --branch=${{ env.DEPLOY_BRANCH }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}